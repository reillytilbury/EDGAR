# This is a template config file for a new experiment. Copy this file to a new directory under experiments/ and edit any necessary fields. 

# DATA CONFIG 
task: new_experiment # name of the sub directory under experiments -- update this to make this more descriptive of the experiment
load_and_process_data_fn: experiments.new_experiment.data_parser.load_and_process_data
create_train_test_trial_split_fn: experiments.new_experiment.data_parser.create_train_test_trial_split

data_processing_params:
  # consider saving some data parsing parameters (thresholds) so that we can save down a yaml copy each time we run an experiment
  data_path: /home/USER/data.npy

# Input configuration - defines the input variables for models
# Each input should have a name and description for prompt generation
inputs:
  - name: stimulus
    description: "Random stimulus"

# HYPERPARAMETER CONFIG 

# Path to experiment-specific diagnostics module (relative to project root)
# If not specified or file doesn't exist, diagnostics will be disabled
diagnostics_path: experiments/new_experiment

seed_programs:
  module: experiments.new_experiment.seed_programs
  function_seeds:
    - model_1
    - model_2
  parameter_estimator_seeds:
    - parameter_estimator_1
    - parameter_estimator_2

experiment_params:
  num_runs: 1
  n_iterations : 12
  time_limit : 60  # in minutes
  k_max : 2
  n_islands : 8
  batch_size : 6
  max_iter : 1000
  critical_population_size : 12
  min_wise_population_size : 0
  n_migrants : 2
  fit_params : true
  tol : 1e-6
  exploit_point : 0.5
  learning_rate : 3e-3
  param_penalty_weight : 0.01
  FAILED_PROGRAM_COST : .inf
  use_image_feedback : false
  use_param_estimator : true
  param_estimator_refinement_rounds : 3
  use_chat_mode : false  # If true, uses persistent chat sessions per island (expensive). Default: false (legacy independent queries)
  chat_token_limit : 50000  # Max tokens per island chat before auto-summarize and reset. 0 = unlimited
  exploration_topology : [1, 2, 3, 4, 5, 6, 7, 0]
  exploitation_topology : [1, 2, 3, 4, 5, 6, 7, 0]
  tiny_lm_name : gemini-2.0-flash-lite
  little_lm_name : gemini-2.0-flash
  large_lm_name : gemini-2.5-flash
  use_large_every : 3
  use_large_model_for_param_estimators: false # Whether parameter estimators should use the large LM (true) or tiny LM (false). 

# Evolution algorithm parameters (used by EvolutionConfig)
evolution:
  capacity_per_island: 12        # Max programs per island (same as critical_population_size)
  n_migrants: 2                  # Programs to migrate each round
  overlap_threshold: 6           # Threshold for cross-island deduplication
  loss_tolerance: 0.01           # Loss difference for similarity detection
  cosine_tolerance: 0.99         # Behavioral similarity threshold
  min_wise_programs: 0           # Minimum "wise" (large LLM) programs to preserve
  large_lm_name: gemini-2.5-flash
  loss_type: train_loss          # 'train_loss' or 'test_loss'

model_name: neuron_model

# Metadata section for validation
_metadata:
  required_prompts:
    - prompts.program_prompt.base
    - prompts.program_prompt.exploit
    - prompts.program_prompt.exploit
    - prompts.program_prompt.code_guidelines
    - prompts.program_prompt.function_signature
    - prompts.program_prompt.docstring_guidelines
    - prompts.program_prompt.per_model_detail
    - prompts.parameter_estimator.base
    - prompts.parameter_estimator.code_guidelines
    - prompts.parameter_estimator.function_signature
    - prompts.parameter_estimator.per_model_detail
    - prompts.jax_translator_prompt
  
  optional_prompts:
    - prompts.program_prompt.image_analysis
    - prompts.parameter_estimator.image_analysis
    
  # Define allowed variables for each prompt type. If you update the allowed variables, please also update prompt_manager.py accordingly
  allowed_variables:
    program_prompt:
      # Shared across all program_prompts (inherited by children)
      _default:
        - k
        - next_version
      code_guidelines:
        - max_lines
      per_model_detail:
        - model_idx
        - train_loss
        - program_code_string
    parameter_estimator:
      _default:
        - k
        - next_version
        - max_lines
      code_guidelines:
        - max_lines
        - next_version
      per_model_detail:
        - model_idx 
        - train_loss
        - program_code_string
        - parameter_estimator_code_string
    jax_translator_prompt: 
      - function_code

prompts:
  program_prompt:
    base: | 
      You are an AI scientist. Below are two models describing a phenomenon, sorted from hightest to lowest loss. 
      Your task is to create a new model, model_v{next_version}, that has a lower loss than the models below.
      *Analyze* the progression of the models, *generalize* the improvements, and *create* a new model that is better than *all* previous models.

    explore: |
      Use the models below as inspiration, but be *creative* and *invent* something new. Which features in the models below correlate with lower loss? 
      Find these features and *extrapolate* them. You should also *combine* features from several models, and *experiment* with new ideas.
      
    exploit: |
      Use the models below as a *template* to create a new model. 
      Which features in the models below correlate with lower loss? Find these features and *extrapolate* them. 
      Focus on *exploiting* the strengths of the existing models and *eliminating* their weaknesses or *redundancies*.
      Are the parameter ranges correct? If not, adjust them to be more appropriate.
      You will be *penalized* for complexity, so make the new model as *simple* as possible while still being better than the previous models.

    # image_analysis: -- no default image analysis prompt.

    code_guidelines: |
      **Code Generation Guidelines:**

      * Import any packages you use.
      * Do not include any text other than the code.
      * Ensure all free parameters are numeric, not strings.
      * IMPORTANT: Your code will be translated to JAX. Avoid boolean indexing (e.g., `array[condition]`), dynamic shapes, and control flow based on array values. Use `jnp.where()` instead of boolean indexing.

    function_signature: |
      **Function Signature:**

      Your model must have this signature:
      ```
      def model_v{next_version}(X, param1=default1, param2=default2, ...):
      ```
      where:
      * `X` is a 2D array with shape `(n_features, n_trials)`. Each row `X[i]` is a different input variable.
      * Access inputs by index: `input_1 = X[0]`, `input_2 = X[1]`, etc.
      * The remaining arguments are free parameters with default values.
      * Return shape: `(n_trials,)` — the predicted response for each trial.

    docstring_guidelines: |
      **Docstring Guidelines:**
      * Begin by listing the parent models and give them a name that describes their key features, e.g., `parent_model_1: simple_exponential_decay-model`, `parent_model_2: double_exponential_decay_model`. 
      * Never refer to the models as `model_v1`, `model_v2`, etc. Instead, refer to them as `parent_models` or their descriptive names (e.g. `simple_exponential_decay_model`).
      * Do not refer to the current model as `model_v{next_version}`. Instead, refer to it as "this model".
      * Provide a simple equation for the model, including all free parameters.
      * Include a brief description of how the model improves upon the previous models, citing specific features or changes that lead to lower loss.

    per_model_detail: |
      loss of model {model_idx}: {train_loss}
      {program_code_string}
      \n
      ----------------------------
      \n

  parameter_estimator:
    base: |
      You are an AI scientist. Your task is to create a simple parameter estimator function, parameter_estimator_v{next_version}, to estimate the free parameters of the latest model, model_v{next_version}.
      The parameter should be estimated directly, using statistical principles. 
      *Analyze* the progression of the parameter estimators, *generalize* the improvements, and *create* a new parameter estimator that is better than *all* previous estimators.


    # image_analysis: -- no default image analysis prompt.

    code_guidelines: |
      **Code Generation Guidelines:**
      * Import any packages you use.
      * Do not include any text other than the code.
      * The only arguments to the function should be the inputs (X) and the spike count.
      * Your response **must** be less than {max_lines} lines (including imports). If it is longer, it will be immediately rejected. 
      * Do not attempt to fit the parameters using complex fitting functions like `curve_fit`, `least_squares` or `minimize`. This function should be a simple starting point for the parameter estimation.

    function_signature: |
      **Function Signature:**

      Your parameter estimator must have this signature:
      ```
      def parameter_estimator_v{next_version}(X, spike_counts):
      ```
      where:
      * `X` is a 2D array with shape `(n_features, n_trials)`. Each row `X[i]` is a different input variable.
      * Access inputs by index: `theta = X[0]`, `contrast = X[1]`, etc.
      * Return: a 1D array of estimated parameter values matching the model's free parameters.

    docstring_guidelines: |
      **Docstring Guidelines:**
      * Begin by listing the parent models and give them a name that describes their key features, e.g., `parent_model_1: simple_exponential_decay-model`, `parent_model_2: double_exponential_decay_model`. 
      * Never refer to the models as `model_v1`, `model_v2`, etc. Instead, refer to them as `parent_models` or their descriptive names (e.g. `simple_exponential_decay_model`).
      * Do not refer to the current model as `model_v{next_version}`. Instead, refer to it as "this model".
      * Provide a simple equation for the model, including all free parameters.
      * Include a brief description of how the model improves upon the previous models, citing specific features or changes that lead to lower loss.

    per_model_detail: |
      loss of model {model_idx}: {train_loss}
      {program_code_string}
      \n
      {parameter_estimator_code_string}
      \n
      ----------------------------
      \n

  jax_translator_prompt: | 
    Convert the following function to a JAX-compatible function.

      Include all necessary imports, and ensure that the function is compatible with JAX transformations like `jax.jit`, `jax.grad`, and `jax.vmap`.
      
      CRITICAL JAX compatibility requirements:
      * Replace all boolean indexing (e.g., `array[condition]`) with `jnp.where(condition, true_value, false_value)`
      * Replace NumPy functions with JAX equivalents (np.array → jnp.array, np.sin → jnp.sin, etc.)
      * Avoid Python control flow (if/for) that depends on array values - use `jnp.where`, `jax.lax.cond`, `jax.lax.scan` instead
      * Do not use dynamic array shapes or indexing with non-constant indices
      * Use `jnp.clip()` instead of boolean masking for bounds
      
      Do not include any text other than the code. 
      Update the function name to be the original name without "_v*". For example, `def neuron_model_v1(X, param1=0.5):` should become `def neuron_model(X, param1=0.5):`.
      Here is the code to translate:
      {function_code}