task: place_cells  # name of the sub directory under experiments
load_and_process_data_fn: experiments.place_cells.data_parser.load_and_process_data

# Update to your local data file path
# Expected fields: time vector, position x/y, and spike times per cell
# Examples of spike keys: spikes, spike_times, spikes_mod1
# Examples of time keys: t, time, timestamps
# data_path: /path/to/your/place_cell_data.npz
# data_path: /path/to/your/place_cell_data.npy

data_path: /home/reilly/Desktop/place_cell_data/hippocampus_place_cells.npz

# Data processing parameters
time_start: null          # use full session if null
time_end: null            # use full session if null
spatial_bin_cm: 3.0       # spatial bin size in cm
time_bin_ms: 20           # time bin size in ms
speed_threshold: 2.5      # minimum speed in cm/s to include data point
min_spikes: 50            # minimum spikes to include a cell
smoothing_sigma: 1.5      # Gaussian smoothing sigma for rate maps (in bins)
wall_val: 0.75            # arena half-width in meters (0.75m for 1.5m x 1.5m arena)
positions_normalized: true
position_unit: normalized # 'normalized', 'm', or 'cm'
filter_place_cells: true
place_filter_kwargs:
  min_spatial_info: 0.3   # bits/spike
  min_peak_rate: 1.0      # Hz
  min_mean_rate: 0.05     # Hz

# Input configuration - defines the input variables for models
inputs:
  - name: x
    description: "Normalized x position in arena [-1, 1]"
  - name: y
    description: "Normalized y position in arena [-1, 1]"
