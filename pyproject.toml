[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar"
version = "0.1.0"
description = "Equation Discovery with Graphical AI Reasoning: an evolutionary framework for discovering scientific equations using LLM-generated programs."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.50.0",
    "cloudpickle>=3.1.2",
    "fastapi>=0.136.3",
    "google-genai>=1.51.0",
    "ipykernel>=7.2.0",
    "jax[cuda12]==0.10.1",
    "jaxopt>=0.8.5",
    "matplotlib>=3.10.3",
    "networkx>=3.2",
    "numpy>=2.2.6",
    "optax>=0.2.5",
    "pandas>=2.2.3",
    "Pillow>=11.2.1",
    "protobuf>=5.29.5",
    "pydantic-ai>=1.96.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "PyYAML>=6.0.2",
    "scikit-learn",
    "scipy>=1.15.2",
    "timeout-decorator>=0.5.0",
    "tqdm>=4.67.1",
    "umap-learn",
]

[project.scripts]
edgar = "edgar.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["edgar*", "edgar_analysis*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not live and not slow'" #By default do not use live API calls or run slow tests
markers = [
    "live: tests that make real LLM API calls",
    "slow: tests that take a long time"
]

[dependency-groups]
dev = ["pre-commit"]
docs = [
    "sphinx>=8.0",
    "sphinx-book-theme>=1.1.0",
    "sphinx-autodoc-typehints>=3.0",
    "myst-parser>=4.0.0",
]

[tool.uv]
package = true

[tool.ruff]
exclude = [
    "projects", 
    "scripts", 
    "figures", 
    "tests/io/test_task", 
    "tests/io/test_task_no_image", 
    "tests/system/test_task", 
    "tutorials"
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
]
ignore = [
    "E501", #line too long
    "E702", #multiple statements on one lines
    "E741", #variables l
]
