[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edgar"
version = "0.1.0"
description = "Equation Discovery with Graphical AI Reasoning: an evolutionary framework for discovering scientific equations using LLM-generated programs."
requires-python = ">=3.13"
dynamic = ["dependencies"]

[project.scripts]
edgar = "edgar.cli:run_cli"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

# `namespaces = true` is needed because most subpackages under `edgar/` have no
# `__init__.py` (PEP 420 namespace packages). Only `edgar/monitoring/` has one.
[tool.setuptools.packages.find]
where = ["."]
include = ["edgar*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not live and not slow'" #By default do not use live API calls or run slow tests
markers = [
    "live: tests that make real LLM API calls",
    "slow: tests that take a long time"
]

[tool.uv]
package = true
