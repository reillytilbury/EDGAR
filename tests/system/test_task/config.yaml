io:
  data_path: ""
  save_path: ""

evolution:
  n_generations: 2
  n_islands: 2
  batch_size: 3
  critical_population_size: 3
  n_migrants: 1
  topology: [1, 0]

llms:
  num_parents: 2
  model_llm: gemini-2.0-flash
  param_est_llm: gemini-2.0-flash
  jax_model_translator_llm: gemini-2.0-flash-lite
  max_lines: 50
  swear_words: ['lstsq', 'scipy.optimize', 'optimize.minimize', 'curve_fit', 'sklearn']

scoring:
  param_penalty_weight: 0.01
  timeout_s: 120.0

  gradient_descent:
    max_iter: 50
    learning_rate: 0.01

project_params:
  seed: 0
  n_samples: 4
  n_trials: 100
  noise_std: 0.0
  n_eval_samples: 2
