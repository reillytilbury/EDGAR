io:
  data_path: "a"
  save_path: "b"

evolution:
  n_generations: 10
  time_limit: 50
  n_islands: 6
  batch_size: 4
  critical_population_size: 10
  n_migrants: 1
  topology: [1, 2, 3, 4, 5, 0]

llms:
  num_parents: 3
  retry:
    max_retries: 2
    initial_delay: 1.1
    backoff_multiplier: 2.1
    max_delay: 60.1
    retryable_status_codes: [500]

  model_llm: gemini-2.5-flash-lite
  param_est_llm: gemini-2.5-flash-lite
  jax_model_translator_llm: gemini-2.5-flash
  log_raw_llm_response: true
  max_lines: 40
  swear_words: []

scoring:
  param_penalty_weight: 0.1
  timeout_s: 100.0

  gradient_descent:
    max_iter: 100
    learning_rate: 0.03