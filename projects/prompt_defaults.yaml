# Prompt defaults for all projects.
# Override in projects/<task>/prompts.yaml.
#
# Two kinds of template variables:
#   - config_vars: come from config/spec, passed explicitly (e.g. k, max_lines, swear_words)
#   - parent_vars: come from Program fields, extracted from parent Programs (e.g. descriptive_name, loss_discover, model_code)

model:
  base: 'You are an AI scientist. Below are {k_max} models describing a phenomenon, sorted from worst to best.

    Your task is to create a new model, that is better than all the models below.


    *Analyze* the progression of the models, *generalize* the improvements, and *create* a new model that is better than *all* previous models.

    '
  explore: 'Use the models below as inspiration, but be *creative* and *invent* something new. Which features in the models below correlate with lower loss?

    Find these features and *extrapolate* them. You should also *combine* features from several models, and *experiment* with new ideas.

    '
  exploit: 'Use the models below as a *template* to create a new model.

    Which features in the models below correlate with lower loss? Find these features and *extrapolate* them.

    Focus on *exploiting* the strengths of the existing models and *eliminating* their weaknesses or *redundancies*.

    You will be *penalized* for complexity, so make the new model as *simple* as possible while still being better than the previous models.

    '
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use.

    * Model signature must be `def model(data, params):` where `data` is a dict of named arrays (e.g. data[''temperature''], data[''pressure'']) where `params` is a dict of named arrays/scalars (e.g. params[''decay_rate''], params[''amplitude'']).

    * Ensure all free parameters (values in `params`) are numeric, not strings or functions.

    '
  docstring_guidelines: '**Docstring Guidelines:**

    * Refer to parent models by descriptive names, not by version numbers.

    * Include a brief description of how the model improves upon the previous models, citing specific features or changes that lead to lower loss.

    '
  image_analysis_instructions: null
  parent_detail_template: 'model: {descriptive_name}

    loss: {loss_discover}

    {model_code}

    ----------------------------

    '
  config_vars:
  - k_max
  parent_vars:
  - descriptive_name
  - loss_discover
  - model_code
parameter_estimator:
  base: 'You are an AI scientist. Your task is to create a simple parameter estimator function to estimate the free parameters of the latest model (shown last below).

    The parameter should be estimated directly, using statistical principles.


    *Analyze* the progression of the parameter estimators, *generalize* the improvements, and *create* a new parameter estimator that is better than *all* previous estimators.

    '
  explore: null
  exploit: null
  code_guidelines: "**Code Generation Guidelines:**\n* Import any packages you use.\n* Do not include any text other than the code.\n* Function signature must be `def parameter_estimator(data):`, where `data` is the single-sample data dict used by `model`.\n* Return a parameter dict with the same keys expected by the model.\n* Your response **must** be less than {max_lines} lines (including imports). If it is longer, it will be immediately rejected.\n* Do not attempt to fit the parameters using complex fitting functions like {swear_words}. We only need a simple, fast initial estimate of the parameters.\n* Do not call the model function in your parameter_estimator code, as you will not have access to it! \n"
  docstring_guidelines: '**Docstring Guidelines:**

    * Provide a simple equation for the model, including all free parameters.

    * Include a brief description of how the model improves upon the previous models, citing specific features or changes that lead to lower loss.

    '
  image_analysis_instructions: null
  parent_detail_template: 'model: {descriptive_name}

    loss: {loss_discover}

    {model_code}

    \n

    {param_est_code}

    \n

    ----------------------------

    \n

    '
  config_vars:
  - max_lines
  - swear_words
  parent_vars:
  - descriptive_name
  - loss_discover
  - model_code
  - param_est_code
jax_translator:
  base: 'Convert the following model and parameter estimator to be JAX-compatible.

    Include all necessary imports (jax, jax.numpy as jnp).

    Ensure compatibility with jax.jit, jax.grad, and jax.vmap.

    Return the translated model code and parameter estimator code separately.

    '
  explore: null
  exploit: null
  code_guidelines: 'CRITICAL JAX compatibility requirements:

    * Replace all boolean indexing with `jnp.where`.

    * Use `jnp` everywhere (no `np`).

    * Avoid Python control flow (if/for) that depends on array values.

    * Do not use dynamic array shapes.

    * Never call Python `int()` / `float()` on JAX values.

    '
  docstring_guidelines: 'Do not include any text other than the code.

    '
  image_analysis_instructions: null
  parent_detail_template: 'Model code:

    {model_code}


    Parameter estimator code:

    {param_est_code}

    '
  config_vars: []
  parent_vars:
  - model_code
  - param_est_code
