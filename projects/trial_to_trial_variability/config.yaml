# ========================
# Prompt Defaults
# ========================
  linked_prompt:
    base: |
      You are an AI scientist. The programs below are biological models of neurons, predicting the neural activity vector of the target cells from source cells given some stimulus. 
      Generate BOTH a new model_v{next_version} and a new parameter_estimator_v{next_version}.
      The parents below show models and their estimators, sorted by loss.
    explore: | 
      Use the models below as *inspiration*, but be *creative* and *invent*
      something new. Which features in the models below correlate with lower loss?
      Find these features and *extrapolate* them. You should also *combine* features
      from several models, and *experiment* with new ideas.
    exploit: | 
      Use the models below as a *template* to create a new model. 
      Which features in the models below correlate with lower loss? Find these features and *extrapolate* them. 
      Focus on *exploiting* the strengths of the existing models and *eliminating* their weaknesses or *redundancies*.
      Are the parameter ranges correct? If not, adjust them to be more appropriate.
      You will be *penalized* for complexity, so make the new model as *simple* as possible while still
      being better than the previous models.
    image_analysis: |
      **Image Analysis Instructions:**
      Attached is a 2x2 plot of target-cell traces (observed vs models).
      Analyze the plot to identify specific failures of the models and estimators.
      Propose specific changes to both the model structure and estimator logic.

    code_guidelines: '**Code Generation Guidelines:**
      * Import any packages you use.
      * Do NOT include any text other than the code.
      * Model signature must be `def model(data, params):` where `data` is a dict that contains exactly 7 keys : 
        1. "stimulus" (shape (n_time,))
        2. "source" (shape (n_source_cells, n_time))
        3. "target" (shape (n_target_cells, n_time))
        4. "source_tuning_params" (shape (n_source_cells, 11))
        5. "target_tuning_params" (shape (n_target_cells, 11))
        6. "source_mean_pred" (shape (n_source_cells, n_times)) # prediction of mean spike rate of source cells according to the double peaked generalised Gaussian orientation tuning function given the stimulus and the tuning parameters
        7. "target_mean_pred" (shape (n_target_cells, n_times)) # prediction of mean spike rate of target cells according to the double peaked generalised Gaussian orientation tuning function given the stimulus and the tuning parameters
      and `params` is a dict of named arrays/scalars.
      * The 11 tuning parameters are arguments to a double peaked generalised Gaussian orientation tuning function which take the form : 

          `python
          def single_cell_tuning_function(theta, theta_pref_1=0.0, baseline=0.0, amplitude_1=1.0, width_ccw_1=1.0, width_cw_1=1.0, exponent_1=2.0, theta_pref_2=jnp.pi, amplitude_2=0.0, width_ccw_2=1.0, width_cw_2=1.0, exponent_2=2.0):
            def _signed_circ_diff_rad(angle_radians, preferred_angle_radians):
                delta = angle_radians - preferred_angle_radians
                return jnp.arctan2(jnp.sin(delta), jnp.cos(delta))
            signed_diff_1 = _signed_circ_diff_rad(theta, theta_pref_1) + eps  # Add small epsilon to avoid log(0) issues
            width_1_effective = jnp.where(signed_diff_1 < 0, width_ccw_1, width_cw_1)
            width_1_effective = jnp.maximum(width_1_effective, 1e-6)
            peak1_component = amplitude_1 * jnp.exp(-0.5 * (jnp.abs(signed_diff_1) / width_1_effective) ** exponent_1)

            signed_diff_2 = _signed_circ_diff_rad(theta, theta_pref_2) + eps  # Add small epsilon to avoid log(0) issues
            width_2_effective = jnp.where(signed_diff_2 < 0, width_ccw_2, width_cw_2)
            width_2_effective = jnp.maximum(width_2_effective, 1e-6)
            peak2_component = amplitude_2 * jnp.exp(-0.5 * (jnp.abs(signed_diff_2) / width_2_effective) ** exponent_2)
            return baseline + peak1_component + peak2_component

      * Ensure all free parameters are numeric, not strings.
      * At the beginning of the code, clip the free parameters to a biologically plausible
      range, e.g., `theta_pref = np.clip(theta_pref, 0, 2 * np.pi)`.
      '
    docstring_guidelines: |
      Each function should include a short docstring.
    per_model_detail: |
      **Parent {model_idx} (loss={train_loss})**
      Model:
      {program_code_string}
      Estimator:
      {parameter_estimator_code_string}

    