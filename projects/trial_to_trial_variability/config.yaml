task: trial_to_trial_variability
model_name: model 

data_processing_params:
  data_path: /home/dabin/data/stringer_2020/gratings_drifting_GT1_2019_04_12_1.npy
  # data_path: /home/dabin/data/jacob_gratings_202507/parsed/
  conc_threshold: 0.55

inputs:
  - name: x
    description: "Input variable"

experiment_params:
  n_iterations: 2
  batch_size: 3
  n_islands: 4
  param_penalty_weight: 0.0
  exploration_topology: [1, 2, 3, 0]
  exploitation_topology: [1, 2, 3, 0]
  param_estimator_refinement_rounds: 0
  open_family_tree: true
  fit_params: false
  linked_llm: gemini-2.0-flash
  use_linked_prompt: false
  swear_words: []
  x_min: -1.0
  x_max: 1.0
  n_bins: 100

# ========================
# Prompt Defaults
# ========================
  linked_prompt:
    base: |
      You are an AI scientist. The programs below are biological models of neurons, predicting the neural activity vector of the target cells from source cells given some stimulus. 
      Generate BOTH a new model_v{next_version} and a new parameter_estimator_v{next_version}.
      The parents below show models and their estimators, sorted by loss.
    explore: | 
      Use the models below as *inspiration*, but be *creative* and *invent*
      something new. Which features in the models below correlate with lower loss?
      Find these features and *extrapolate* them. You should also *combine* features
      from several models, and *experiment* with new ideas.
    exploit: | 
      Use the models below as a *template* to create a new model. 
      Which features in the models below correlate with lower loss? Find these features and *extrapolate* them. 
      Focus on *exploiting* the strengths of the existing models and *eliminating* their weaknesses or *redundancies*.
      Are the parameter ranges correct? If not, adjust them to be more appropriate.
      You will be *penalized* for complexity, so make the new model as *simple* as possible while still
      being better than the previous models.
    image_analysis: |
      **Image Analysis Instructions:**
      Attached is a 2x2 plot of target-cell traces (observed vs models).
      Analyze the plot to identify specific failures of the models and estimators.
      Propose specific changes to both the model structure and estimator logic.
    code_guidelines: |
      Return exactly TWO Python code blocks:
      1) def model_v{next_version}(X, params): ...
      2) def parameter_estimator_v{next_version}(X, Y): ...
      Keep total length under {max_lines} lines combined.
    docstring_guidelines: |
      Each function should include a short docstring.
    per_model_detail: |
      **Parent {model_idx} (loss={train_loss})**
      Model:
      {program_code_string}
      Estimator:
      {parameter_estimator_code_string}