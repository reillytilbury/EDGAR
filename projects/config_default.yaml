# Base defaults for all projects.
# Override only what you need in projects/<task>/config.yaml.

run:
  random_seed: null #Used for spawning and migration

io:
  # Path to task data. Override in each project config.
  data_path: /home/USER/data.npy

  # Base directory for run outputs. Each run lands in <save_path>/MM-DD/HH-MM-SS/.
  save_path: program_databases

evolution:
  # Number of generations per run.
  n_generations: 12

  # Number of islands in the evolutionary system.
  n_islands: 8

  # Number of parallel LLM calls per island per generation (so total calls per generation = n_islands * batch_size).
  batch_size: 6

  # Hard capacity per island population. If exceeded, the weakest programs are removed to make room for new ones.
  critical_population_size: 12

  # Number of migrants exchanged between islands each generation.
  n_migrants: 2

  # Island topology for migration
  topology: [1, 2, 3, 4, 5, 6, 7, 0]

llms:
  # Number of parent programs in each prompt
  num_parents: 2

  # 500 - Unexpected error on Google's servers, 503 - service temporarily down — all transient per Google's retry guidance, 504 - Request timed out (google gemini server-side 5 min timeout).
  # 429 Rate-limited - because the number of requests we send concurrently is fixed, we should not ignore this error
  # 400 Bad Request, 401 Unauthorized, 403 Forbidden → hard failures, do not retry.
  # Error guidelines : https://ai.google.dev/gemini-api/docs/troubleshooting
  retry:
    max_retries: 3
    initial_delay: 10.0
    backoff_multiplier: 2.0
    max_delay: 60.0
    retryable_status_codes: [500, 502, 503, 504]

  # Provider switch: "google" (Gemini) or "anthropic" (Claude). Selects the default
  # model for any role left null below, so a project can switch providers with this
  # one line. The API actually called is always inferred from the model-name prefix
  # (gemini-* -> GOOGLE_API_KEY, claude-* -> ANTHROPIC_API_KEY), so you can also mix
  # providers by naming models explicitly per role.
  provider: google

  # LLMs for different tasks. Each can be a string or a list; a list is traversed in
  # order by generation (with cycling). Leave null to inherit the provider's default.
  model_llm: null
  param_est_llm: null
  jax_model_translator_llm: null
  max_tokens: 10000

  # Print raw LLM responses (parts, usage, provider_details) for debugging.
  log_raw_llm_response: false

  # Max lines allowed in a parameter estimator response.
  max_lines: 50

  # Banned function calls/fragments during code generation.
  swear_words: ['lstsq', 'scipy.optimize', 'optimize.minimize', 'curve_fit', 'sklearn']

scoring:
  # Complexity penalty on parameterized programs.
  param_penalty_weight: 0.01

  # Total wall-clock timeout (seconds) for a single program scoring run.
  timeout_s: 120.0

  gradient_descent:
    # Max optimizer iterations for parameter fitting.
    max_iter: 1000

    # Parameter optimizer learning rate.
    learning_rate: 0.003
