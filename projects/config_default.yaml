# Base defaults for all projects.
# Override only what you need in projects/<task>/config.yaml.

task:
  # Path to task data. Override in each task config.
  data_path: /home/USER/data.npy

evolution:
  # Number of generations per run.
  n_iterations: 12

  # Time limit per run in minutes.
  time_limit: 60

  # Number of islands in the evolutionary system.
  n_islands: 8

  # Number of parallel LLM calls per island per generation (so total calls per generation = n_islands * batch_size).
  batch_size: 6

  # Hard capacity per island population. If exceeded, the weakest programs are removed to make room for new ones.
  critical_population_size: 12

  # Number of migrants exchanged between islands each generation.
  n_migrants: 2

  # Island topology for migration
  topology: [1, 2, 3, 4, 5, 6, 7, 0]

llms:
  # Number of parent programs in each prompt
  k_max: 2

  # LLMs for different tasks. Each can be a string or a list.
  # If a list is provided, it is traversed in order by iteration (with cycling)
  model_llm: [gemini-2.5-flash, gemini-2.0-flash, gemini-2.0-flash]
  param_est_llm: gemini-2.0-flash
  jax_translator_llm: gemini-2.0-flash-lite

  # Banned function calls/fragments during code generation.
  swear_words: ['lstsq', 'scipy.optimize', 'optimize.minimize', 'curve_fit', 'sklearn']

scoring:
  # Complexity penalty on parameterized programs.
  param_penalty_weight: 0.01

  # Total wall-clock timeout (seconds) for a single program scoring run.
  timeout_s: 120.0

  gradient_descent:
    # Max optimizer iterations for parameter fitting.
    max_iter: 1000

    # Parameter optimizer learning rate.
    learning_rate: 0.003
