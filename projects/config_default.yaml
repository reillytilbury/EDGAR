# Base defaults for all projects.
#
# Do not put task-specific wiring in this file. The runner auto-discovers:
# - projects/<task>/spec.py
# - fixed function names inside spec.py
#
# Override only what you need in projects/<task>/config.yaml.

# ========================
# Project Identity
# ========================

# Name of the task folder under projects/.
# Task configs should override this value.
task: new_experiment

# Name used in prompts for the evolving model family.
model_name: neuron_model

# Proportion of samples used for training split (remaining go to test).
training_sample_ratio: 0.5


# ========================
# Data Defaults
# ========================

data_processing_params:
  # Path to task data. Override in each task config.
  data_path: /home/USER/data.npy

# Input variable definitions used in prompts.
# Task configs should replace this list with real inputs.
inputs:
  - name: stimulus
    description: "Random stimulus"


# ========================
# Experiment Runtime
# ========================

experiment_params:
  # Number of full runs.
  num_runs: 1

  # Number of generatations per run.
  n_iterations: 12

  # Time limit per run in minutes.
  time_limit: 60

  # Number of parent programs for each new program
  k_max: 2

  # Number of islands in the evolutionary system.
  n_islands: 8

  # Number of parallel LLM calls per island per generation (so total calls per generation = n_islands * batch_size).
  batch_size: 6

  # Max optimizer iterations for parameter fitting.
  max_iter: 1000

  # Hard capacity per island population. If exceeded, the weakest programs are removed to make room for new ones.
  critical_population_size: 12

  # Minimum count of "wise" programs to preserve on each island (ie programs generated by large model)
  min_wise_population_size: 0

  # Number of migrants exchanged between islands each generation.
  n_migrants: 2

  # Whether to optimize free parameters.
  fit_params: true

  # Explore/exploit balance point.
  exploit_point: 0.5

  # Parameter optimizer learning rate.
  learning_rate: 3e-3

  # Random seed used for sample/trial splitting and related stochastic operations.
  random_seed: 42

  # Evaluation grid configuration for diagnostics/evaluation matrices.
  # eval_keys: list of data dict keys to create eval grids for.
  # If None, uses all keys in the data dict.
  eval_keys: None
  # Scalar applies to all eval keys; list must match eval_keys length.
  # If None, defaults to the min/max of the data.
  x_min: None
  x_max: None
  n_bins: 100

  # Complexity penalty on parameterized programs.
  param_penalty_weight: 0.01

  # Sentinel cost for failed programs.
  FAILED_PROGRAM_COST: .inf

  # Whether to use parameter estimators.
  use_param_estimator: true

  # Per-sample timeout (seconds) for parameter estimator calls.
  # Set to 0 or null to disable timeout.
  param_estimator_timeout_s: 5.0

  # Hard timeout (seconds) for each full objective evaluation
  # (parameter init + optimization + evaluation).
  # Set to 0 or null to disable this cap.
  objective_timeout_s: 60.0

  # Number of refinement rounds for parameter estimators.
  param_estimator_refinement_rounds: 3

  # If true, use persistent per-island chat sessions.
  use_chat_mode: false

  # Token budget per chat before summarize/reset (0 = unlimited).
  chat_token_limit: 50000

  # If true, write full prompt/response text to hypothesis_engine.log and generation JSONL.
  log_prompts: false

  # If true, write JAX translation prompt/response/code text to logs and generation JSONL.
  log_jax_translations: false

  # Island graph for exploration exchanges.
  exploration_topology: [1, 2, 3, 4, 5, 6, 7, 0]

  # Island graph for exploitation exchanges.
  exploitation_topology: [1, 2, 3, 4, 5, 6, 7, 0]

  # LLMs for different tasks. Each can be a string or a list.
  # If a list is provided, it is traversed in order by iteration.
  model_llm: [gemini-3.1-flash-lite-preview, gemini-2.5-flash, gemini-2.5-flash]
  param_est_llm: gemini-2.5-flash
  jax_translator_llm: gemini-2.5-flash


  # Banned function calls/fragments during code generation.
  swear_words: ['lstsq', 'scipy.optimize', 'optimize.minimize', 'curve_fit', 'sklearn']


# ========================
# Evolution Policy
# ========================

evolution:
  # Max programs retained per island.
  capacity_per_island: 12

  # Programs migrated each round.
  n_migrants: 2

  # Similarity overlap threshold for deduplication.
  overlap_threshold: 6

  # Loss tolerance for similarity checks.
  loss_tolerance: 0.01

  # Cosine tolerance for behavioral similarity checks.
  cosine_tolerance: 0.99

  # Minimum number of wise programs to preserve.
  min_wise_programs: 0

  # Large model name for evolution internals.
  large_lm_name: gemini-2.5-flash

  # Which loss to prioritize in sorting/selection.
  loss_type: train_loss


# ========================
# Prompt Metadata
# ========================

_metadata:
  required_prompts:
    - prompts.program_prompt.base
    - prompts.program_prompt.exploit
    - prompts.program_prompt.exploit
    - prompts.program_prompt.code_guidelines
    - prompts.program_prompt.docstring_guidelines
    - prompts.program_prompt.per_model_detail
    - prompts.parameter_estimator.base
    - prompts.parameter_estimator.code_guidelines
    - prompts.parameter_estimator.per_model_detail
    - prompts.parameter_estimator.refinement_image_instructions
    - prompts.jax_translator_prompt

  optional_prompts:
    - prompts.program_prompt.image_analysis

  allowed_variables:
    program_prompt:
      _default:
        - k
        - next_version
        - model_name
      code_guidelines:
        - max_lines
        - next_version
        - model_name
      per_model_detail:
        - model_idx
        - train_loss
        - optimization_time_s
        - program_code_string

    parameter_estimator:
      _default:
        - k
        - next_version
        - max_lines
        - model_name
      code_guidelines:
        - max_lines
        - next_version
      per_model_detail:
        - model_idx
        - train_loss
        - optimization_time_s
        - program_code_string
        - parameter_estimator_code_string

    jax_translator_prompt:
      - function_code



# ========================
# Prompt Defaults
# ========================

prompts:
  program_prompt:
    base: |
      You are an AI scientist. Below are two models describing a phenomenon, sorted from hightest to lowest loss.
      Your task is to create a new model, {model_name}_v{next_version}, that has a lower loss than the models below.

      *Analyze* the progression of the models, *generalize* the improvements, and *create* a new model that is better than *all* previous models.

    explore: |
      Use the models below as inspiration, but be *creative* and *invent* something new. Which features in the models below correlate with lower loss?
      Find these features and *extrapolate* them. You should also *combine* features from several models, and *experiment* with new ideas.

    exploit: |
      Use the models below as a *template* to create a new model.
      Which features in the models below correlate with lower loss? Find these features and *extrapolate* them.
      Focus on *exploiting* the strengths of the existing models and *eliminating* their weaknesses or *redundancies*.
      You will be *penalized* for complexity, so make the new model as *simple* as possible while still being better than the previous models.

    code_guidelines: |
      **Code Generation Guidelines:**
      * Import any packages you use.
      * Do not include any text other than the code.
      * Model signature must be `def model(data, params):` where `data` is a dict of named arrays (e.g. data['stimulus'], data['response']) where `params` is a dict of named arrays/scalars.
      * Ensure all free parameters are numeric, not strings.

    docstring_guidelines: |
      **Docstring Guidelines:**
      * Begin by listing the parent models and give them a name that describes their key features, e.g., `parent_model_1: simple_exponential_decay-model`, `parent_model_2: double_exponential_decay_model`.
      * Never refer to the models as `{model_name}_v1`, `{model_name}_v2`, etc. Instead, refer to them as `parent_models` or their descriptive names.
      * Do not refer to the current model as `{model_name}_v{next_version}`. Instead, refer to it as "this model".
      * Provide a simple equation for the model, including all free parameters.
      * Include a brief description of how the model improves upon the previous models, citing specific features or changes that lead to lower loss.

    per_model_detail: |
      loss of model {model_idx}: {train_loss}
      {program_code_string}
      \n
      ----------------------------
      \n
  parameter_estimator:
    generation_base: |
      You are an AI scientist. Your task is to create a simple parameter estimator function, parameter_estimator_v{next_version}, to estimate the free parameters of the latest model, {model_name}_v{next_version}.
      The parameter should be estimated directly, using statistical principles.
      *Analyze* the progression of the parameter estimators, *generalize* the improvements, and *create* a new parameter estimator that is better than *all* previous estimators.

    base: |
      You are an AI scientist. Your task is to improve the existing parameter estimator function, parameter_estimator_prev.
      This function estimates the free parameters of the current model. Both the current model and its parameter estimator are included below.
      The parameters should be estimated directly, using statistical principles.

    code_guidelines: |
      **Code Generation Guidelines:**
      * Import any packages you use.
      * Do not include any text other than the code.
      * The only arguments to the function should be the inputs (X) and the spike count.
      * Return a parameter dict with the same keys expected by the model.
      * Your response **must** be less than {max_lines} lines (including imports). If it is longer, it will be immediately rejected.
      * Do not attempt to fit the parameters using complex fitting functions like `curve_fit`, `least_squares` or `minimize`.
      * Do not call the model function in your parameter_estimator code, as you will not have access to it! Instead, use direct statistical relationships between the inputs and outputs to estimate parameters.

    docstring_guidelines: |
      **Docstring Guidelines:**
      * Begin by listing the parent models and give them a name that describes their key features, e.g., `parent_model_1: simple_exponential_decay-model`, `parent_model_2: double_exponential_decay_model`.
      * Never refer to the models as `{model_name}_v1`, `{model_name}_v2`, etc. Instead, refer to them as `parent_models` or their descriptive names.
      * Do not refer to the current model as `{model_name}_v{next_version}`. Instead, refer to it as "this model".
      * Provide a simple equation for the model, including all free parameters.
      * Include a brief description of how the model improves upon the previous models, citing specific features or changes that lead to lower loss.

    refinement_image_instructions: |
      - An image is attached comparing data vs the current estimator's model fits.
      - Compare predicted outputs to the data across multiple samples.
      - Identify systematic mismatches (bias, scale, shape, timing, or phase depending on task).
      - Propose parameter-estimation changes that address consistent failures seen across samples.
      - Base changes on repeated patterns, not single-sample outliers.

    per_model_detail: |
      loss of model {model_idx}: {train_loss}
      {program_code_string}
      \n
      {parameter_estimator_code_string}
      \n
      ----------------------------
      \n
  jax_translator_prompt: |
    Convert the following function to a JAX-compatible function.

      Include all necessary imports, and ensure that the function is compatible with JAX transformations like `jax.jit`, `jax.grad`, and `jax.vmap`.

      Treat all arrays as JAX arrays (`jnp.ndarray`). Do not mention NumPy in docstrings or type hints.
      Use `jnp` everywhere (no `np`). Inputs should be described as `jnp.ndarray`.
      Write out the shape of each array in the docstring and in the code comments. Be very careful when broadcasting and ensure that shapes are compatible.

      CRITICAL JAX compatibility requirements:
      * Replace all boolean indexing (e.g., `array[condition]`) with `jnp.where(condition, true_value, false_value)`
      * Replace NumPy functions with JAX equivalents (np.array → jnp.array, np.sin → jnp.sin, etc.)
      * Avoid Python control flow (if/for) that depends on array values - use `jnp.where`, `jax.lax.cond`, `jax.lax.scan` instead
      * Do not use dynamic array shapes or indexing with non-constant indices
      * Never call Python `int()` / `float()` / `range()` on JAX values (e.g., no `int(jnp.ceil(...))`).
      * For lattice/grid models, avoid data-dependent `jnp.arange(-n, n+1)` where `n` depends on parameters.
      * Instead, create a fixed static maximum range (e.g., `n_range_max`) and use a mask.
      * Use `jnp.clip()` instead of boolean masking for bounds.

      Do not include any text other than the code.
      Update the function name to be the original name without "_v*".
      Here is the code to translate:
      {function_code}

