# ========================
# Project Identity
# ========================

# Task folder name under projects/.
task: orientation_tuning


# ========================
# Data Defaults
# ========================

# Data-processing overrides for this task.
data_processing_params:
  data_path: /home/dabin/data/stringer_2020/gratings_drifting_GT1_2019_04_12_1.npy
  activity_threshold: 0.4
  conc_threshold: 0.55

# Input variable definitions used by prompts and model code.
inputs:
- name: theta
  description: "Stimulus orientation angle in radians [0, 2\u03C0]"


# ========================
# Prompt Defaults
# ========================

# Prompt text overrides for this task.
prompts:
  program_prompt:
    base: 'You are an AI scientist. The programs below are biological models of neurons.
      The models are sorted from highest to lowest loss.

      Your task is to create a new neuron model, neuron_model_v{next_version}, that
      has a lower loss than the models below.

      *Analyze* the progression of the models, *generalize* the improvements, and
      *create* a new model that is better than *all* previous models.

      '
    explore: "Use the models below as inspiration, but be *creative* and *invent*\
      \ something new. Which features in the models below correlate with lower loss?\
      \ \nFind these features and *extrapolate* them. You should also *combine* features\
      \ from several models, and *experiment* with new ideas.\n"
    exploit: "Use the models below as a *template* to create a new model. \nWhich\
      \ features in the models below correlate with lower loss? Find these features\
      \ and *extrapolate* them. \nFocus on *exploiting* the strengths of the existing\
      \ models and *eliminating* their weaknesses or *redundancies*.\nAre the parameter\
      \ ranges correct? If not, adjust them to be more appropriate.\nYou will be *penalized*\
      \ for complexity, so make the new model as *simple* as possible while still\
      \ being better than the previous models.\n"
    image_analysis: "**Image Analysis Instructions:**\n\nAttached is a scatter plot\
      \ of the neuron models' performance on top of raw neural data. The binned mean\
      \ is plotted in **sky-blue**, `neuron_model_v1` is plotted in **green**, and\
      \ `neuron_model_v2` is plotted in **red**. \n\nAnalyse the models' fits to the\
      \ data in the image below. Identify systematic weaknesses of the models by observing\
      \ patterns across multiple cell plots. For instance, consider:\n*   **Model\
      \ Comparisons:** Which models are better for each cell? That is to say, which\
      \ models track the blue curve better? Which features of the models are responsible\
      \ for improving the fit?\n*   **Model Fit:** How well do the models fit the\
      \ binned data mean? Look for places where even the models (**red** curve for\
      \ best model, **green** for second best model) deviate most from the binned\
      \ data mean (**blue** curve). This is where the models are weakest, and where\
      \ you should focus your improvements.\n*   **Model Shape:** Do the models' shapes\
      \ (e.g., peak sharpness, width, skewness, amplitude, etc.) align with the binned\
      \ data mean (**blue**) and raw data scatter points (**black**)? If not, how\
      \ do they differ? How can you change the model to better match the data shape?\n\
      *   **Parameter Flexibility:** Are there free parameters that could be introduced\
      \ or modified to better capture the observed response profiles? Utilize your\
      \ analysis of the shortcomings of the current models' shapes and add free parameters\
      \ or modify existing ones to address these issues.\n\nUse this analysis to inform\
      \ the design of a new neuron model, `neuron_model_v{next_version}`, that improves\
      \ upon the previous models. \n\nInclude your analysis of the image in the docstring\
      \ of your new model. Point to specific subplots in the image that illustrate\
      \ the *strengths* and *weaknesses* of the parent models. Explain how you plan\
      \ to **fix** the weaknesses of the parent models.\n"
    code_guidelines: '**Code Generation Guidelines:**


      * Import any packages you use.

      * Do not include any text other than the code.

      * Ensure all free parameters are numeric, not strings.

      * At the beginning of the code, clip the free parameters to a biologically plausible
      range, e.g., `theta_pref = np.clip(theta_pref, 0, 2 * np.pi)`.

      * IMPORTANT: Your code will be translated to JAX. Avoid boolean indexing (e.g.,
      `array[condition]`), dynamic shapes, and control flow based on array values.
      Use `jnp.where()` instead of boolean indexing.

      '
    function_signature: "**Function Signature:**\n\nYour neuron model must have this\
      \ signature:\n```\ndef neuron_model_v{next_version}(X, param1=default1, param2=default2,\
      \ ...):\n```\nwhere:\n* `X` is a 2D array with shape `(n_features, n_trials)`.\
      \ Each row `X[i]` is a different input variable.\n* For orientation tuning,\
      \ `X[0]` is the stimulus angle (theta) in radians.\n* Access inputs by index:\
      \ `theta = X[0]`, `contrast = X[1]`, etc.\n* The remaining arguments are free\
      \ parameters with default values.\n* Return shape: `(n_trials,)` \u2014 the\
      \ predicted response for each trial.\n"
    docstring_guidelines: '**Docstring Guidelines:**

      * Begin by listing the parent models and give them a name that describes their
      key features, e.g., `parent_model_1: simple_exponential_decay-model`, `parent_model_2:
      double_exponential_decay_model`. Never refer to the models as `neuron_model_v1`,
      `neuron_model_v2`, etc. Instead, refer to them as `parent_models` or their descriptive
      names (e.g. `simple_exponential_decay_model`).

      * Do not refer to the current model as `neuron_model_v{next_version}`. Instead,
      refer to it as "this model".

      * Provide a simple equation for the model, including all free parameters.

      * Include a brief description of how the model improves upon the previous models,
      citing specific features or changes that lead to lower loss.

      '
  parameter_estimator:
    base: "You are an AI scientist. Your task is to create a simple parameter estimator\
      \ function, parameter_estimator_v{next_version}, to estimate the free parameters\
      \ of the latest neuron model, neuron_model_v{next_version}.\nThe parameter should\
      \ be estimated directly, using statistical principles and knowledge of what\
      \ the parameters represent biologically. \n*Analyze* the progression of the\
      \ parameter estimators, *generalize* the improvements, and *create* a new parameter\
      \ estimator that is better than *all* previous estimators.\n"
    image_analysis: '**Image Analysis Instructions:**


      Attached is a scatter plot where each neuron model curve is drawn **using the
      parameters produced by its corresponding parameter estimator function**. The
      binned mean is **sky blue**, `neuron_model_v1` is **green**, and `neuron_model_v2`
      is **red**.


      Focus on how *parameter values* affect model fit:

      * **Mismatch Regions:** Where do the best (red) and worst (green) curves deviate
      most from the blue mean? Which parameters control those regions?

      * **Sensitivity:** Determine which parameters the output is most sensitive to
      in poorly fitting zones.

      * **Biological Plausibility:** Keep estimates within realistic biological ranges.


      Summarise this analysis **inside the docstring** of `parameter_estimator_v{next_version}`
      and explain how your estimator addresses identified weaknesses.

      '
    code_guidelines: "**Code Generation Guidelines:**\n* Import any packages you use.\n\
      * Do not include any text other than the code.\n* The only arguments to the\
      \ function should be the inputs (X) and the spike count.\n* Your response **must**\
      \ be less than {max_lines} lines (including imports). If it is longer, it will\
      \ be immediately rejected. \n* Do not attempt to fit the parameters using complex\
      \ fitting functions like `curve_fit`, `least_squares` or `minimize`. This function\
      \ should be a simple starting point for the parameter estimation.\n"
    function_signature: '**Function Signature:**


      Your parameter estimator must have this signature:

      ```

      def parameter_estimator_v{next_version}(X, spike_counts):

      ```

      where:

      * `X` is a 2D array with shape `(n_features, n_trials)`. Each row `X[i]` is
      a different input variable.

      * For orientation tuning, `X[0]` is the stimulus angle (theta) in radians.

      * Access inputs by index: `theta = X[0]`, `contrast = X[1]`, etc.

      * `spike_counts` has shape `(n_trials,)`.

      * Return: a 1D array of estimated parameter values matching the neuron model''s
      free parameters.

      '
    docstring_guidelines: '**Docstring Guidelines:**

      * Begin by listing the parent models and give them a name that describes their
      key features, e.g., `parent_model_1: simple_exponential_decay-model`, `parent_model_2:
      double_exponential_decay_model`. Never refer to the models as `neuron_model_v1`,
      `neuron_model_v2`, etc. Instead, refer to them as `parent_models` or their descriptive
      names (e.g. `simple_exponential_decay_model`).

      * Do not refer to the current model as `neuron_model_v{next_version}`. Instead,
      refer to it as "this model".

      * Provide a simple equation for the model, including all free parameters.

      * Include a brief description of how the model improves upon the previous models,
      citing specific features or changes that lead to lower loss.

      '
  jax_translator_prompt: "Convert the following function to a JAX-compatible function.\n\
    \n  Include all necessary imports, and ensure that the function is compatible\
    \ with JAX transformations like `jax.jit`, `jax.grad`, and `jax.vmap`.\n  \n \
    \ CRITICAL JAX compatibility requirements:\n  * Replace all boolean indexing (e.g.,\
    \ `array[condition]`) with `jnp.where(condition, true_value, false_value)`\n \
    \ * Replace NumPy functions with JAX equivalents (np.array \u2192 jnp.array, np.sin\
    \ \u2192 jnp.sin, etc.)\n  * Avoid Python control flow (if/for) that depends on\
    \ array values - use `jnp.where`, `jax.lax.cond`, `jax.lax.scan` instead\n  *\
    \ Do not use dynamic array shapes or indexing with non-constant indices\n  * Use\
    \ `jnp.clip()` instead of boolean masking for bounds\n  \n  Do not include any\
    \ text other than the code. \n  Update the function name to be the original name\
    \ without \"_v*\". For example, `def neuron_model_v1(X, param1=0.5):` should become\
    \ `def neuron_model(X, param1=0.5):`.\n  Here is the code to translate:\n  {function_code}\n"
