model:
  base: 'You are an AI scientist. The programs below are biological models of place cells in the hippocampus.

    The models are sorted from highest to lowest loss.

    Your task is to create a new place cell model that has a lower loss than the models below.

    Analyze the progression of the models, generalize the improvements, and create a new model that is better than all previous models.

    Place cells exhibit localized firing fields in 2D space. Your model outputs must remain in a plausible physiological range and should be spatially localized.

    '
  explore: 'Use the models below as inspiration, but be *creative* and *invent* something new.

    Which features in the models below correlate with lower loss? Find these features and *extrapolate* them.

    Consider different formulations for localized spatial fields: isotropic Gaussian, elliptical, sum of multiple fields, or center-surround profiles.

    '
  exploit: 'Use the models below as a *template* to create a new model.

    Which features correlate with lower loss? Find these features and *extrapolate* them.

    Focus on *exploiting* strengths and *eliminating* weaknesses or *redundancies*.

    You will be *penalized* for complexity.

    '
  code_guidelines: "**Code Generation Guidelines:**\n\n* Import any packages you use.\n* Do not include any text other than the code.\n* Model signature must be `def model(data, params):` where `data` is a dict with keys 'pos_x', 'pos_y' and `params` is a dict of named arrays/scalars.\n* Ensure all free parameters are numeric, not strings.\n* Clip the free parameters to biologically plausible ranges at the beginning of the code.\n* If using `np.exp()`, ALWAYS clip the argument to prevent overflow.\n* Avoid boolean indexing; use `jnp.where()` instead for JAX compatibility.\n"
  docstring_guidelines: '**Docstring Guidelines:**

    * Begin by listing the parent models with descriptive names.

    * Do not refer to the current model as a version number. Refer to it as "this model".

    * Provide a simple equation for the model, including all free parameters.

    * Include a brief description of how the model improves upon the previous models.

    '
  image_analysis_instructions: null
  parent_detail_template: '**Parent {model_idx}**

    {program_code_string}

    '
  global_vars: []
  parent_vars:
  - model_idx
  - program_code_string
parameter_estimator:
  base: 'You are an AI scientist. Your task is to create a parameter estimator function to estimate the free parameters of the latest place cell model.

    The role of the parameter estimator is to infer the best parameter values of each cell from observed firing rates.

    Place cell parameters are typically derived from spatial statistics of the firing field (e.g., center of mass, covariance).

    Analyze the progression of the parameter estimators and create a new one that is better than all previous estimators.

    '
  explore: null
  exploit: null
  code_guidelines: "**Code Generation Guidelines:**\n* Import any packages you use.\n* Do not include any text other than the code.\n* Return a parameter dict with the same keys expected by the model.\n* Function signature must be `def parameter_estimator(data):`.\n* Your response **must** be less than {max_lines} lines.\n* Use spatial statistics (center of mass, covariance, peak detection) to estimate parameters.\n* Do not use complex fitting functions like `curve_fit`, `least_squares` or `minimize`.\n"
  docstring_guidelines: '**Docstring Guidelines:**

    * Begin by listing the parent models with descriptive names.

    * Do not refer to the current model as a version number. Refer to it as "this model".

    * Include a brief description of the estimation method.

    '
  image_analysis_instructions: null
  parent_detail_template: '**Parent {model_idx}**

    {parameter_estimator_code_string}

    '
  global_vars:
  - max_lines
  parent_vars:
  - model_idx
  - parameter_estimator_code_string
