# ========================
# Project Identity
# ========================

# Task folder name under projects/.
task: place_cells

# Prompt-facing model family name.
model_name: place_model


# ========================
# Data Defaults
# ========================

# Data-processing overrides for this task.
data_processing_params:
  data_path: /home/reilly/Desktop/place_cell_data/hippocampus_place_cells.npz
  time_start: null
  time_end: null
  spatial_bin_cm: 3.0
  time_bin_ms: 20
  speed_threshold: 2.5
  min_spikes: 50
  smoothing_sigma: 1.5
  wall_val: 0.75
  positions_normalized: true
  position_unit: normalized
  filter_place_cells: true
  place_filter_kwargs:
    min_spatial_info: 0.3
    min_peak_rate: 1.0
    min_mean_rate: 0.05

# Input variable definitions used by prompts and model code.
inputs:
- name: x
  description: Normalized x position in arena [-1, 1]
- name: y
  description: Normalized y position in arena [-1, 1]


# ========================
# Experiment Runtime
# ========================

# Runtime overrides for this task.
experiment_params:
  n_iterations: 3
  x_min: [-1.0, -1.0]
  x_max: [1.0, 1.0]
  n_bins: 100


# ========================
# Prompt Metadata
# ========================

# Prompt metadata overrides for this task.
_metadata:
  required_prompts:
  - prompts.program_prompt.base
  - prompts.program_prompt.exploit
  - prompts.program_prompt.explore
  - prompts.program_prompt.code_guidelines
  - prompts.program_prompt.docstring_guidelines
  - prompts.program_prompt.per_model_detail
  - prompts.parameter_estimator.base
  - prompts.parameter_estimator.code_guidelines
  - prompts.parameter_estimator.per_model_detail
  - prompts.jax_translator_prompt


# ========================
# Prompt Defaults
# ========================

# Prompt text overrides for this task.
prompts:
  program_prompt:
    base: 'You are an AI scientist. The programs below are biological models of place
      cells in the hippocampus.

      The models are sorted from highest to lowest loss.

      Your task is to create a new place cell model, place_model_v{next_version},
      that has a lower loss than the models below.

      *Analyze* the progression of the models, *generalize* the improvements, and
      *create* a new model that is better than *all* previous models.


      **Domain Knowledge:** Place cells exhibit localized firing fields in 2D space
      as animals navigate an environment.

      Typical firing rates are bounded (e.g., 0-50 Hz), with a low baseline away from
      the field.

      Your model outputs must remain in a plausible physiological range and should
      be spatially localized.

      Unbounded functions like `exp(alpha * x)` with large alpha can produce astronomically
      large outputs.

      Always ensure your model outputs are bounded (e.g., by clipping exponential
      arguments or the final output).

      '
    explore: 'Use the models below as inspiration, but be *creative* and *invent*
      something new.

      Which features in the models below correlate with lower loss?

      Find these features and *extrapolate* them. You should also *combine* features
      from several models, and *experiment* with new ideas.

      Consider different formulations for localized spatial fields:

      * Isotropic 2D Gaussian place fields

      * Elliptical (rotated) Gaussian fields

      * Sum or mixture of multiple localized fields

      * Center-surround (Mexican hat) profiles to capture inhibitory surrounds

      '
    exploit: 'Use the models below as a *template* to create a new model.

      Which features in the models below correlate with lower loss? Find these features
      and *extrapolate* them.

      Focus on *exploiting* the strengths of the existing models and *eliminating*
      their weaknesses or *redundancies*.

      Are the parameter ranges correct (center location, width, orientation, baseline)?
      If not, adjust them to be more appropriate.

      You will be *penalized* for complexity, so make the new model as *simple* as
      possible while still being better than the previous models.

      '
    image_analysis: '**Image Analysis Instructions:**


      Attached are 2D rate maps showing actual firing rate data (left) and model predictions
      (right) for several place cells.

      The model predictions are generated using parameters estimated by the corresponding
      parameter estimator.


      Analyse the models'' fits to the data in the images below. Identify systematic
      weaknesses by observing patterns across multiple cells:

      *   **Field Location:** Does the model place the field center in the right location?

      *   **Field Width:** Are the fields too sharp or too diffuse?

      *   **Field Shape:** Are fields circular vs elliptical; do models capture elongation
      or orientation?

      *   **Baseline:** Is the baseline firing rate captured correctly away from the
      field?

      *   **Edge Effects:** How do the models behave near arena boundaries?


      Use this analysis to inform the design of a new place model, `place_model_v{next_version}`,
      that improves upon the previous models.

      Include your analysis in the docstring, pointing to specific cells that illustrate
      strengths and weaknesses.

      '
    code_guidelines: "**Code Generation Guidelines:**\n\n* Import any packages you\
      \ use.\n* Do not include any text other than the code.\n* Ensure all free parameters\
      \ are numeric, not strings.\n* At the beginning of the code, clip the free parameters\
      \ to biologically plausible ranges:\n  - `x0 = np.clip(x0, -1.0, 1.0)` and `y0\
      \ = np.clip(y0, -1.0, 1.0)` for field center\n  - `sigma = np.clip(sigma, 0.05,\
      \ 1.0)` for field width\n  - `theta = np.clip(theta, 0, np.pi)` for field orientation\n\
      \  - `amplitude = np.clip(amplitude, 0, 50)` and `baseline = np.clip(baseline,\
      \ 0, 20)`\n* If using `np.exp()`, ALWAYS clip the argument to prevent overflow:\
      \ `np.exp(np.clip(x, -10, 10))`\n* IMPORTANT: Your code will be translated to\
      \ JAX. Avoid boolean indexing (e.g., `array[condition]`), dynamic shapes, and\
      \ control flow based on array values. Use `jnp.where()` instead of boolean indexing.\n"
    function_signature: '**Function Signature:**


      Your place cell model must have this signature:

      ```

      def place_model_v{next_version}(X, param1=default1, param2=default2, ...):

      ```

      where:

      * `X` is a 2D array with shape `(n_features, n_trials)`. Each row `X[i]` is
      a different input variable.

      * For place cells, `X[0]` is the x position and `X[1]` is the y position (both
      normalized to [-1, 1]).

      * Access inputs by index: `x = X[0]`, `y = X[1]`

      * The remaining arguments are free parameters with default values.

      * Return shape: `(n_trials,)` - the predicted firing rate for each position.

      '
    docstring_guidelines: '**Docstring Guidelines:**

      * Begin by listing the parent models with descriptive names, e.g., `parent_model_1:
      isotropic_gaussian_field`, `parent_model_2: elliptical_gaussian_field`.

      * Do not refer to the current model as `place_model_v{next_version}`. Instead,
      refer to it as "this model".

      * Provide a simple equation for the model, including all free parameters.

      * Include a brief description of how the model improves upon the previous models.

      '
  parameter_estimator:
    base: 'You are an AI scientist. Your task is to create a parameter estimator function,
      parameter_estimator_v{next_version}, to estimate the free parameters of the
      latest place cell model, place_model_v{next_version}.

      The role of the parameter estimator is to infer the best parameter values of
      each cell from observed firing rates.

      Place cell parameters are typically derived from spatial statistics of the firing
      field (e.g., center of mass, covariance).

      *Analyze* the progression of the parameter estimators and *create* a new one
      that is better than *all* previous estimators.

      '
    image_analysis: '**Image Analysis Instructions:**


      Attached are 2D rate maps showing actual firing rate data (left) and model predictions
      (right).

      The model predictions use parameters from the corresponding parameter estimator.


      Focus on how *parameter values* affect model fit:

      * **Field Center:** Are fields shifted? Which parameters control the center?

      * **Field Width:** Are fields too wide or too narrow?

      * **Field Orientation:** Are elongated fields rotated correctly?

      * **Amplitude/Baseline:** Are peak and baseline rates captured correctly?


      Summarise this analysis in the docstring of `parameter_estimator_v{next_version}`.

      '
    code_guidelines: '**Code Generation Guidelines:**

      * Import any packages you use.

      * Do not include any text other than the code.

      * The only arguments to the function should be the inputs (X) and the firing
      rates.

      * Your response **must** be less than {max_lines} lines (including imports).
      If it is longer, it will be immediately rejected.

      * Use spatial statistics (center of mass, covariance, peak detection) to estimate
      parameters.

      * Do not use complex fitting functions like `curve_fit`, `least_squares` or
      `minimize`.

      '
    function_signature: '**Function Signature:**


      Your parameter estimator must have this signature:

      ```

      def parameter_estimator_v{next_version}(X, firing_rates):

      ```

      where:

      * `X` is a 2D array with shape `(n_features, n_trials)`.

      * `X[0]` is the x position and `X[1]` is the y position.

      * `firing_rates` has shape `(n_trials,)`.

      * Return: a 1D array of estimated parameter values matching the place model''s
      free parameters.

      '
    docstring_guidelines: '**Docstring Guidelines:**

      * Begin by listing the parent models with descriptive names.

      * Do not refer to the current model as `place_model_v{next_version}`. Instead,
      refer to it as "this model".

      * Include a brief description of the estimation method.

      '
  jax_translator_prompt: "Convert the following function to a JAX-compatible function.\n\
    \n  Include all necessary imports, and ensure that the function is compatible\
    \ with JAX transformations like `jax.jit`, `jax.grad`, and `jax.vmap`.\n  \n \
    \ CRITICAL JAX compatibility requirements:\n  * Replace all boolean indexing (e.g.,\
    \ `array[condition]`) with `jnp.where(condition, true_value, false_value)`\n \
    \ * Replace NumPy functions with JAX equivalents (np.array -> jnp.array, np.sin\
    \ -> jnp.sin, etc.)\n  * Avoid Python control flow (if/for) that depends on array\
    \ values - use `jnp.where`, `jax.lax.cond`, `jax.lax.scan` instead\n  * Do not\
    \ use dynamic array shapes or indexing with non-constant indices\n  * Use `jnp.clip()`\
    \ instead of boolean masking for bounds\n  \n  Do not include any text other than\
    \ the code. \n  Here is the code to translate:\n  {function_code}\n"
