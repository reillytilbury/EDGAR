model:
  base: 'You are an AI scientist. The programs below are biological models. The models are sorted from highest to lowest loss.

    Your task is to create a new model that has a lower loss than the models below.

    Analyze the progression of the models, generalize the improvements, and create a new model that is better than all previous models.

    '
  explore: Use the models below as *inspiration*, but be *creative* and *invent* something new. Which features in the models below correlate with lower loss? Find these features and *extrapolate* them.
  exploit: Use the models below as a *template* to create a new model. Which features correlate with lower loss? Find these features and *extrapolate* them. Focus on *exploiting* strengths and *eliminating* weaknesses or *redundancies*. You will be *penalized* for complexity.
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use.

    * Do not include any text other than the code.

    * Model signature must be `def model(data, params):` where `data` is a dict with keys "pos_x", "pos_y" and `params` is a dict of named arrays/scalars.

    * Ensure all free parameters are numeric, not strings.

    '
  docstring_guidelines: '**Docstring Guidelines:**

    * Begin by listing the parent models and give them descriptive names.

    * Do not refer to the current model as a version number. Refer to it as "this model".

    * Provide a simple equation for the model, including all free parameters.

    * Include a brief description of how the model improves upon the previous models.

    '
  image_analysis_instructions: null
  parent_detail_template: '**Parent {model_idx}**

    {program_code_string}

    '
  global_vars: []
  parent_vars:
  - model_idx
  - program_code_string
parameter_estimator:
  base: 'You are an AI scientist. Your task is to create a simple parameter estimator function to estimate the free parameters of the latest model.

    The parameter should be estimated directly, using statistical principles and knowledge of what the parameters represent biologically.

    Analyze the progression of the parameter estimators, generalize the improvements, and create a new parameter estimator that is better than all previous estimators.

    '
  explore: null
  exploit: null
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use.

    * Do not include any text other than the code.

    * Return a parameter dict with the same keys expected by the model.

    * Function signature must be `def parameter_estimator(data):`.

    * Your response must be less than {max_lines} lines.

    * Do not use complex fitting functions like `curve_fit`, `least_squares` or `minimize`.

    '
  docstring_guidelines: '**Docstring Guidelines:**

    * Begin by listing the parent models and give them descriptive names.

    * Do not refer to the current model as a version number.

    * Include a brief description of the estimation method.

    '
  image_analysis_instructions: null
  parent_detail_template: '**Parent {model_idx}**

    {parameter_estimator_code_string}

    '
  global_vars:
  - max_lines
  parent_vars:
  - model_idx
  - parameter_estimator_code_string
