model:
  base: 'You are an AI scientist. The models below are sorted by performance, with the best parent last.

    Your goal is to generate a new model that outperforms all previous models.

    Analyze the progression of models, generalize what worked, and create a better model.

    '
  explore: 'Use the parent models as inspiration, but be creative and try new structure.

    Identify model features that correlate with lower loss, combine strong ideas, and test novel variants.

    '
  exploit: 'Use the parent models as a template to produce a stronger model.

    Extrapolate features associated with lower loss and remove weak or redundant structure.

    You will be penalized for complexity, so keep the model as simple as possible.

    '
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use.

    * Do not include any text other than the code.

    * Model signature must be `def model(data, params):` where `data` is a dict with keys "x" and "y" where `params` is a dict of named arrays/scalars.

    * Ensure all free parameters are numeric, not strings.

    '
  docstring_guidelines: '**Docstring Guidelines:**

    * Use a descriptive name for this model, not a version number.

    * Briefly describe what the model computes.

    '
  image_analysis_instructions: null
  parent_detail_template: '**Model {parent_number}**

    {program_code_string}

    '
  config_vars: []
  parent_vars:
  - program_code_string
parameter_estimator:
  base: 'You are an AI scientist. Your task is to create a simple parameter estimator to estimate the free parameters of the latest model.

    The parameter should be estimated directly, using statistical principles.

    Analyze the progression of the parameter estimators, generalize the improvements, and create a new parameter estimator that is better than all previous estimators.

    '
  explore: null
  exploit: null
  code_guidelines: '**Code Generation Guidelines:**

    * Import any packages you use.

    * Do not include any text other than the code.

    * Function signature must be `def parameter_estimator(data):`.

    * Return a parameter dict with keys matching the model''s free parameters.

    * Do not call the model function in your estimator code; this function must be self-contained.

    * Do not use heavy optimization routines such as `curve_fit`, `least_squares`, or `minimize`.

    '
  docstring_guidelines: '**Docstring Guidelines:**

    * Briefly describe the estimation method.

    '
  image_analysis_instructions: null
  parent_detail_template: '**Model {parent_number}**

    {parameter_estimator_code_string}

    '
  config_vars: []
  parent_vars:
  - parameter_estimator_code_string
