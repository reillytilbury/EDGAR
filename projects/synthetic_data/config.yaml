# ========================
# Project Identity
# ========================

# Task folder name under projects/.
task: synthetic_data

# Prompt-facing model family name.
model_name: model


# ========================
# Data Defaults
# ========================

# Data-processing overrides for this task.
data_processing_params:
  SEED: 42
  n_samples: 1000
  n_trials: 2000
  noise_std: 0.1


# ========================
# Experiment Runtime
# ========================

# Runtime overrides for this task.
experiment_params:
  n_iterations: 2
  batch_size: 3
  n_islands: 4
  exploration_topology: [1, 2, 3, 0]
  exploitation_topology: [1, 2, 3, 0]
  param_estimator_refinement_rounds: 0
  open_family_tree: true
  x_min: -1.0
  x_max: 1.0
  n_bins: 100
 

# ========================
# Prompt Defaults
# ========================

# Prompt text overrides for this task.
prompts:
  program_prompt:
    image_analysis: |
      **Image Analysis Instructions:**

      Attached is a 3x3 diagnostic plot of model fits on a rich dataset.
      For each subplot (sample):
      * Black points are raw observed data `(x, y)`.
      * Blue line is the binned mean response over x.
      * Model_v1 is in green, model_v2 is in red. 

      Use the image to identify systematic failure modes across multiple samples:
      * Where do model curves miss the blue trend (bias, wrong curvature, wrong oscillation shape)?
      * Are errors concentrated near specific x-ranges (edges vs center)?
      * Do models underfit or overfit high-amplitude regions?
      * Explicitly cite at least 2 poorly fit samples by sample number (e.g., "Sample 123") and describe what fails there.

      Use this analysis to design `model_v{next_version}` with lower loss.
      Include concise image-based reasoning in the docstring.

    code_guidelines: '**Code Generation Guidelines:**
      * Import any packages you use.
      * Do not include any text other than the code.
      * Model signature must be `def model(X, params):` where `params` is a dict of named arrays/scalars.
      * Ensure all free parameters are numeric, not strings.

      '
  parameter_estimator:
    refinement_image_instructions: |
      **Image instructions:**
    
      Attached is a 3x3 diagnostic plot of model fits with the current parameter_estimator on a rich dataset.
      For each subplot (sample):
      * Black points are raw observed data `(x, y)`.
      * Blue line is the binned mean response over x.
      * Model predictions are in orange.
      
      Use the image to identify systematic failure modes across multiple samples:
      * Identify which parts of the parameter_estimator code are causing failures in the image-based evaluation.
      * Propose specific code changes to fix these failures, citing samples and code lines in your analysis.
      * Include these analyses in the docstring of the next parameter_estimator version. 
      * Do *not* call the model function in your parameter_estimator code, as you will not have access to it!
      * Write a new parameter_estimator function that incorporates your proposed code changes.
