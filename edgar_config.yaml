seed_programs:
  - seed_1:
    function: |
      import numpy as np

      def neuron_model(theta, A=1.0, B=0.2, phase=0.0):
          theta = np.asarray(theta)
          return B + A * np.cos(theta - phase)

    parameter_estimator: |
      import numpy as np

      def parameter_estimator(theta, spikes):
          B = float(np.percentile(spikes, 5))
          A = float(np.max(spikes) - B)
          peak = float(theta[np.argmax(spikes)])
          return np.array([A, B, peak])

  - seed_2:
    function: |
      import numpy as np

      def neuron_model(theta, A1=1.0, A2=0.5, B=0.2, phase=0.0):
          theta = np.asarray(theta)
          return B + A1 * np.cos(theta - phase) + A2 * np.cos(2 * (theta - phase))

    parameter_estimator: |
      import numpy as np

      def parameter_estimator(theta, spikes):
          B = float(np.percentile(spikes, 10))
          centered = spikes - B
          phase = float(theta[np.argmax(centered)])
          A1 = float(np.max(centered))
          A2 = float(np.percentile(centered, 90) - np.percentile(centered, 50))
          return np.array([A1, A2, B, phase])

