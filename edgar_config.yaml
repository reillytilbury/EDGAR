  program_creation:
    base: |
      You are an AI scientist. The programs below are sorted from worst to best.

      Your task is to create a new {function_name}, {function_name}_v{version_index}, that has a lower loss than the models below.

      *Analyze* the progression of the models, *generalize* the improvements, and *create* a new model that is better than *all* previous models.

diagnostic_function: |
  import matplotlib.pyplot as plt
  import numpy as np
  import io

  def diagnostic_image(programs, X, Y, save_path, metadata=None):
      metadata = metadata or {}
      fig, axes = plt.subplots(3, 3, figsize=(9, 9))
      random_units = np.random.choice(len(Y), size=9, replace=False)
      for i, unit in enumerate(random_units):
          ax = axes[i // 3, i % 3]
          ax.plot(X[unit], Y[unit], alpha=0.5)
          ax.set_title(f"Unit {unit}")
      fig.suptitle("Random sample responses for diagnostic context")
      fig.tight_layout()
      buf = io.BytesIO()
      fig.savefig(buf, format="png", dpi=150)
      plt.close(fig)
      buf.seek(0)
      with open(save_path, "wb") as handle:
          handle.write(buf.getvalue())
      buf.seek(0)
      return buf.getvalue()