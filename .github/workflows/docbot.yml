name: Documentation Bot

on:
  workflow_dispatch: # Manual trigger
    inputs:
      base_branch:
        description: 'Branch to run docbot on and use as PR base'
        required: true
        default: 'gamma'

jobs:
  docbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch || github.ref }}
          fetch-depth: 0 # Full history for git log/diff

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run DocBot
        run: uv run python .docbot/run_bot.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Parse Report
        id: parse_report
        run: |
          if [ -f .docbot/report.md ]; then
            # Extract Title: find line after marker, take first line
            TITLE=$(sed -n '/---COMMIT_TITLE---/,/---PR_BODY---/{//!p}' .docbot/report.md | head -n 1)
            # Extract Body: all lines after marker
            BODY=$(sed -n '/---PR_BODY---/,$p' .docbot/report.md | sed '1d')
            
            # GitHub Action outputs handle multiline strings with EOF syntax
            echo "title=$TITLE" >> $GITHUB_OUTPUT
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "title=docs: documentation update by DocBot" >> $GITHUB_OUTPUT
            echo "body=This PR was automatically generated by the Documentation Bot." >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.parse_report.outputs.title }}
          author: docbot <docbot@users.noreply.github.com>
          committer: docbot <docbot@users.noreply.github.com>
          title: ${{ steps.parse_report.outputs.title }}
          body: ${{ steps.parse_report.outputs.body }}
          branch: docbot-updates
          base: ${{ github.event.inputs.base_branch || 'gamma' }}
          delete-branch: true
