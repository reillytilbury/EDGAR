name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest

  ping-google:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest "tests/llm/test_llm_calling.py::test_call_llm_provider_ping[gemini-2.5-flash-lite-GOOGLE_API_KEY]" -m live -v
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  ping-anthropic:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest "tests/llm/test_llm_calling.py::test_call_llm_provider_ping[claude-haiku-4-5-ANTHROPIC_API_KEY]" -m live -v
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
